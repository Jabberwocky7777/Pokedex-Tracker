# ── Real client address behind a reverse proxy ───────────────────────────────
# Must come before the rate limits below, which count per client address.
# The trusted ranges are in this file; TRUSTED_PROXIES replaces them at start-up.
include /etc/nginx/pokedex-real-ip.conf;

# ── Rate limiting ─────────────────────────────────────────────────────────────
# Login is the only endpoint worth brute-forcing: 10 attempts/minute per client.
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
# Sync is chatty by design: every sync is a pull plus a push, the app polls
# every 30 s, and the iOS app adds a CORS preflight to each request. Several
# devices behind one router share an address. 120/minute
# with a burst of 40 leaves room for that and still stops a runaway client.
limit_req_zone $binary_remote_addr zone=sync_limit:10m rate=120r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The sync server accepts JSON bodies up to 4 MB (express.json in
    # sync-server/server.js). nginx's default of 1 MB would turn a large push
    # away first, with an HTML error page the app can't read. Keep the two equal.
    client_max_body_size 4m;

    # ── Compression ───────────────────────────────────────────────────────────
    # pokemon.json is ~4 MB and the app bundle ~1 MB uncompressed; both shrink
    # to a few hundred KB. (text/html is always compressed once gzip is on.)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml text/plain application/xml;

    # ── Security headers ──────────────────────────────────────────────────────
    # nginx drops these inside any location that has its own add_header, so the
    # locations below that set Cache-Control include the same file again.
    include /etc/nginx/pokedex-security-headers.conf;

    # ── Health check (no rate limiting — needed for login screen + TrueNAS) ──
    location = /health {
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 5s;
        proxy_connect_timeout 3s;
    }

    # ── Login ────────────────────────────────────────────────────────────────
    # Any spelling the sync server could take for the login path ("/api/Login",
    # "/api/login/") gets the login limit, not the looser one below. (The server
    # also only answers the exact "/api/login".)
    location ~* ^/api/login/?$ {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # ── Sync API proxy (pull, push) ──────────────────────────────────────────
    # The sync server runs on port 3001 inside the same container.
    # Proxied through nginx so browser requests stay same-origin (no CORS needed).
    # Auth enforced by the sync server via Bearer token.
    location /api/ {
        limit_req zone=sync_limit burst=40 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # ── Hashed assets ─────────────────────────────────────────────────────────
    # Everything Vite emits under /assets/ has a content hash in its name
    # (index-BVB3d2I4.js), so a 1-year immutable cache is safe. Files copied
    # from public/ (favicon.svg, icons.svg) have no hash and are not matched here.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/pokedex-security-headers.conf;
        try_files $uri =404;
    }

    # ── Data files (pokemon.json, moves.json, learnsets.json) ─────────────────
    location /data/ {
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/pokedex-security-headers.conf;
        try_files $uri =404;
    }

    # ── Service worker and manifest ───────────────────────────────────────────
    # Always revalidated, so a new build is picked up the next time the app opens.
    location ~ ^/(sw\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/pokedex-security-headers.conf;
        try_files $uri =404;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
