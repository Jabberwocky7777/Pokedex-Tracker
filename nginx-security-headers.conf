# Included by nginx.conf at server level and again in every location that sets
# its own headers (nginx does not inherit add_header into those).
add_header X-Content-Type-Options   "nosniff"                         always;
add_header X-Frame-Options          "DENY"                            always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
add_header Permissions-Policy       "geolocation=(), camera=(), microphone=()" always;
# Browsers only honour this over HTTPS (behind a TLS proxy); over plain HTTP it is ignored.
add_header Strict-Transport-Security "max-age=31536000"               always;
