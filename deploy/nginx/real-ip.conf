# Which addresses are trusted to say who the real client is.
#
# Behind a reverse proxy (Cloudflare Tunnel, Nginx Proxy Manager, Traefik, …)
# every request arrives from the proxy's address. Without this, the rate limits
# in default.conf would count all visitors as one client: ten wrong password
# guesses a minute by anyone would lock everyone out of signing in.
#
# For connections from these ranges, nginx takes the client address from
# X-Forwarded-For instead. real_ip_recursive makes it use the last address in
# that header that is NOT one of these ranges, so a visitor can't pick their own
# address by sending the header themselves through the proxy.
#
# This file is the default: loopback and the private ranges, which covers a
# proxy on the same host or the same LAN with no configuration. Set the
# TRUSTED_PROXIES environment variable to replace it (docker-entrypoint.sh
# rewrites this file at start-up): a comma-separated list of addresses or CIDR
# ranges, e.g. "172.16.0.0/12" or "192.168.1.10", or "none" to trust nothing.
#
# The trade-off of the default: a device on your own network that connects
# directly (not through the proxy) could send X-Forwarded-For itself and so
# dodge the login rate limit. If that matters, set TRUSTED_PROXIES to just the
# proxy's address.
set_real_ip_from 127.0.0.0/8;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from ::1;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
