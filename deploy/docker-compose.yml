# Run from the repository root:
#   docker compose -f deploy/docker-compose.yml up -d      (pulls the published image)
#   docker compose -f deploy/docker-compose.yml build      (builds it from this checkout)
services:
  pokedex-tracker:
    image: ghcr.io/jabberwocky7777/pokedex-tracker:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: pokedex-tracker
    restart: unless-stopped
    ports:
      - "7777:80"
    env_file:
      - ../.env        # APP_USER, APP_PASSWORD, SYNC_TOKEN — see .env.example
    volumes:
      - sync-data:/data

volumes:
  sync-data:           # persists sync.json across container restarts
