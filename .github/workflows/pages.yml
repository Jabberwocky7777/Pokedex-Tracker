name: AltStore source (GitHub Pages)

# GitHub Pages serves only the AltStore / SideStore source:
#   https://jabberwocky7777.github.io/Pokedex-Tracker/apps.json
# plus its icon and a page that points to the repository. Before this, Pages
# built the whole repository root with Jekyll and published every file in it.
# The URLs above stay exactly the same; `iconURL` in apps.json still uses the
# raw.githubusercontent.com address of pokeball.png, which doesn't depend on Pages.

on:
  push:
    branches: [main]
    paths: [apps.json, pokeball.png, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish apps.json
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}apps.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check apps.json against the iOS project and package.json
        # SideStore refuses an install whose version differs from the IPA's
        run: |
          jq -e . apps.json > /dev/null
          source_version=$(jq -r '.apps[0].version' apps.json)
          for v in $(grep -o 'MARKETING_VERSION = [^;]*' ios/App/App.xcodeproj/project.pbxproj | cut -d' ' -f3 | sort -u); do
            [ "$v" = "$source_version" ] || { echo "apps.json says $source_version, project.pbxproj says $v"; exit 1; }
          done
          # package.json carries the same version as semver ("1.5" → "1.5.0")
          package_version=$(jq -r .version package.json)
          expected=$source_version; case "$expected" in *.*.*) ;; *) expected="$expected.0" ;; esac
          [ "$package_version" = "$expected" ] || { echo "apps.json says $source_version, package.json says $package_version (expected $expected)"; exit 1; }

      - name: Assemble the site
        run: |
          mkdir site
          cp apps.json pokeball.png site/
          touch site/.nojekyll
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Pokédex Tracker — AltStore source</title>
          <meta http-equiv="refresh" content="0; url=https://github.com/Jabberwocky7777/Pokedex-Tracker">
          <p>This is the AltStore / SideStore source for <a href="https://github.com/Jabberwocky7777/Pokedex-Tracker">Pokédex Tracker</a>.
          Add <code>https://jabberwocky7777.github.io/Pokedex-Tracker/apps.json</code> in AltStore or SideStore.</p>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
