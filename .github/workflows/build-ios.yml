name: Build iOS IPA

# Run by hand (Actions → Build iOS IPA → Run workflow) for a test build, or
# called by release.yml for a tagged release. Either way the IPA is uploaded
# as the PokedexTracker-IPA artifact.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    # Pinned, so a release IPA doesn't change with GitHub's default image. The
    # last good build ran on macos-26 with Xcode 26.6; move both together.
    runs-on: macos-26

    env:
      XCODE_APP: /Applications/Xcode_26.6.app

    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Select Xcode
        run: |
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP is not on this runner image. Installed: $(ls -d /Applications/Xcode_*.app | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      # The Capacitor CLI from package-lock.json (npm ci installed it)
      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Resolve Swift Package dependencies
        working-directory: ios/App
        run: |
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App

      - name: Build ad-hoc signed archive
        working-directory: ios
        run: |
          xcodebuild archive \
            -project App/App.xcodeproj \
            -scheme App \
            -archivePath build/App.xcarchive \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -allowProvisioningUpdates

      - name: Package as IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          ditto "build/App.xcarchive/Products/Applications/App.app" "Payload/App.app"
          ditto -c -k --sequesterRsrc --keepParent Payload PokedexTracker.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: PokedexTracker-IPA
          path: ios/PokedexTracker.ipa
          retention-days: 30
