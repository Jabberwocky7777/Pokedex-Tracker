name: Build Android APK

# Run by hand (Actions → Build Android APK → Run workflow) for a test build, or
# called by release.yml for a tagged release. Either way the signed APK is
# uploaded as the PokedexTracker-APK artifact.
#
# Needs three repository secrets (docs/android.md, "Signing"):
#   ANDROID_KEYSTORE_BASE64    the release keystore (PKCS12), base64
#   ANDROID_KEYSTORE_PASSWORD  its password (store and key)
#   ANDROID_KEY_ALIAS          the key's alias
# and android/signing-cert-sha256.txt, the certificate's fingerprint: an APK
# signed with any other key fails here, because Android would refuse it as an
# update of the installed app.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      # The Capacitor CLI from package-lock.json (npm ci installed it)
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 is not set (docs/android.md, Signing)"; exit 1; }
          [ -s android/signing-cert-sha256.txt ] || { echo "::error::android/signing-cert-sha256.txt is missing (docs/android.md, Signing)"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Check the signature is the release key
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk PokedexTracker.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs PokedexTracker.apk | tee certs.txt
          actual=$(grep -m1 'certificate SHA-256 digest' certs.txt | awk '{print $NF}')
          expected=$(tr -d ' :\n\r' < android/signing-cert-sha256.txt | tr 'A-F' 'a-f')
          [ "$actual" = "$expected" ] || { echo "::error::APK signed with $actual, expected $expected"; exit 1; }

      - name: Check the version
        run: |
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$aapt2" dump badging PokedexTracker.apk | head -1

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: PokedexTracker-APK
          path: PokedexTracker.apk
          retention-days: 30
