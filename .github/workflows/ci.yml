name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Lint, type-check, test, build and audit
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install sync server dependencies
        run: npm ci --prefix sync-server

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc -b

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Only what ships: the app's runtime dependencies and the sync server's.
      # Dev tooling is left to Dependabot.
      - name: Audit runtime dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --omit=dev --audit-level=high --prefix sync-server

  # Pushes to main build (and publish) the image in build-and-push.yml. This
  # covers everything else — pull requests and other branches — so a broken
  # Dockerfile or nginx config (the build runs `nginx -t`) is caught before it
  # reaches main. Nothing is pushed.
  docker:
    name: Build the Docker image (no push)
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          platforms: linux/amd64
