# Included by default.conf at server level and again in every location that sets
# its own headers (nginx does not inherit add_header into those).
add_header X-Content-Type-Options   "nosniff"                         always;
add_header X-Frame-Options          "DENY"                            always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
add_header Permissions-Policy       "geolocation=(), camera=(), microphone=()" always;
# Only what the app loads, so a script injected into the page could neither run
# nor send the sync token (kept in localStorage) anywhere else:
#   scripts   this origin only — no inline scripts, no eval
#   styles    this origin and inline styles (React style attributes and the theme's
#             <style> block need them); fonts are this origin's (public/fonts)
#   images    this origin, Pokémon sprites (raw.githubusercontent.com) and
#             trainer sprites (play.pokemonshowdown.com)
#   requests  this origin (/api, /health, /data), and the sprite host — the
#             service worker fetches sprites itself to keep them for offline use
# When the app starts loading something from a new host, add it here.
# `vite preview` sends this same header (vite.config.ts reads it from this file).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://raw.githubusercontent.com https://play.pokemonshowdown.com; connect-src 'self' https://raw.githubusercontent.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Browsers only honour this over HTTPS (behind a TLS proxy); over plain HTTP it is ignored.
add_header Strict-Transport-Security "max-age=31536000"               always;
