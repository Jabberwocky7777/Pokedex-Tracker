# Run from the repository root:
#   docker compose -f deploy/docker-compose.yml up -d      (pulls the published image)
#   docker compose -f deploy/docker-compose.yml build      (builds it from this checkout)
services:
  pokedex-tracker:
    image: ghcr.io/jabberwocky7777/pokedex-tracker:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: pokedex-tracker
    restart: unless-stopped
    # Nothing in the container may gain privileges it starts without (su-exec
    # only ever drops them). cap_drop is not set: nginx and the entrypoint need
    # several capabilities (bind :80, chown /data, switch user), and the smoke
    # test has not been run with a reduced set.
    security_opt:
      - no-new-privileges:true
    ports:
      - "7777:80"
    env_file:
      - ../.env # APP_USER, APP_PASSWORD, SYNC_TOKEN — see .env.example
    volumes:
      - sync-data:/data

volumes:
  sync-data: # persists sync.json across container restarts
