version: 2
updates:
  # The app
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request for the routine updates; majors come one at a time
      minor-and-patch:
        update-types: [minor, patch]

  # The sync server
  - package-ecosystem: npm
    directory: /sync-server
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
